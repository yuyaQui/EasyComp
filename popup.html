<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="label">問題</a>
    <textarea name="question" , rows="3" , cols="60" , placeholder="例：日本の最高峰である山は？"></textarea>
    <a class="label">解答</a>
    <textarea name="answer" , rows="1" , cols="60" , placeholder="例：富士山"></textarea>
    <a class="label">補足</a>
    <textarea name="supplement" , rows="2" , cols="60" , placeholder="別解・解説など"></textarea>
    <a class="label">補足</a>
    <textarea name="url" , rows="2" , cols="60" , placeholder="参考サイトのURL"></textarea>
    <a class="label">URL</a>
    <textarea name="spreadsheet" , rows="2" , cols="60" , placeholder="スプレッドシートのURLを入力してください"></textarea>
    <input type="button" class="button" id="id_add" value="追加">
    <a class="savetext">保存しました</a>
    <script src="popup.js"></script>
</body>

</html>
